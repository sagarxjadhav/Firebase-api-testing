<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Advanced Flutter Firestore Query Parser</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Code', 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #1e1e2e;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1em;
        }

        .content {
            padding: 20px;
        }

        .query-input {
            width: 100%;
            padding: 16px;
            background: #2d2d3d;
            border: 2px solid #404056;
            border-radius: 10px;
            color: #fff;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            min-height: 160px;
            resize: vertical;
            margin-bottom: 16px;
        }

        .query-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 8px 4px;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
        }

        .btn-delete:hover {
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
        }

        .analysis-section {
            background: #2d2d3d;
            padding: 16px;
            border-radius: 10px;
            margin: 16px 0;
            border-left: 4px solid #667eea;
        }

        .requirements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin: 16px 0;
        }

        .req-item {
            background: #404056;
            padding: 12px;
            border-radius: 8px;
        }

        .req-item h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1em;
        }

        .req-item input {
            width: 100%;
            padding: 10px;
            background: #2d2d3d;
            border: 1px solid #555;
            border-radius: 5px;
            color: #fff;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-weight: 500;
            font-size: 14px;
        }

        .status.success { background: #2d5a2d; border: 1px solid #4caf50; color: #fff; }
        .status.error { background: #5a2d2d; border: 1px solid #f44336; color: #fff; }
        .status.warning { background: #5a4d2d; border: 1px solid #ff9800; color: #fff; }

        .response-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            white-space: pre-wrap;
            font-size: 13px;
        }

        .parsed-query {
            background: #0f3460;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #00d4ff;
        }

        .config-section {
            background: #2d2d3d;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-size: 13px;
            color: #aaa;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #1e1e2e;
            border: 1px solid #404056;
            border-radius: 5px;
            color: #fff;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }

        .config-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }
            
            .btn {
                padding: 10px 16px;
                font-size: 13px;
                margin: 6px 3px;
            }
            
            .config-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .requirements-grid {
                grid-template-columns: 1fr;
            }
            
            .content {
                padding: 15px;
            }
            
            .query-input {
                font-size: 13px;
                padding: 14px;
                min-height: 140px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                border-radius: 12px;
            }
            
            .header {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.3em;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 12px;
                margin: 5px 2px;
            }
            
            .config-buttons {
                flex-direction: column;
            }
            
            .config-buttons .btn {
                width: 100%;
                margin: 4px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 Flutter Firestore Query Parser</h1>
            <p>Paste your Flutter code and get the exact Firestore response</p>
        </div>

        <div class="content">
            <textarea class="query-input" id="queryInput" placeholder="Paste your Flutter Firestore query here:
Examples:
final doc = await FirebaseFirestore.instance
  .collection('users')
  .doc(phoneNumber)
  .get();

final snapshot = await FirebaseFirestore.instance
  .collection('products')
  .where('price', isGreaterThan: 100)
  .orderBy('createdAt')
  .limit(10)
  .get();">final doc = await FirebaseFirestore.instance
  .collection('users')
  .doc(phoneNumber)
  .get();</textarea>

            <button class="btn" onclick="parseQuery()">🔍 Parse Query</button>
            <button class="btn" onclick="clearAll()" style="background: #666;">🗑️ Clear</button>

            <!-- Firebase Config Section -->
            <div class="config-section" id="configSection" style="display: none;">
                <h3>🔌 Firebase Configuration</h3>
                <div class="config-grid">
                    <div class="form-group">
                        <label>API Key:</label>
                        <input type="text" id="apiKey" placeholder="AIzaSy...">
                    </div>
                    <div class="form-group">
                        <label>Auth Domain:</label>
                        <input type="text" id="authDomain" placeholder="your-project.firebaseapp.com">
                    </div>
                    <div class="form-group">
                        <label>Project ID:</label>
                        <input type="text" id="projectId" placeholder="your-project-id">
                    </div>
                    <div class="form-group">
                        <label>App ID:</label>
                        <input type="text" id="appId" placeholder="1:123456789:web:abc123">
                    </div>
                </div>
                <div class="config-buttons">
                    <button class="btn" onclick="initializeFirebase()" id="initBtn" disabled>🔌 Initialize Firebase</button>
                    <button class="btn btn-delete" onclick="deleteFirebaseConfig()" id="deleteConfigBtn" style="display: none;">🗑️ Delete Config</button>
                </div>
            </div>

            <!-- Analysis Section -->
            <div class="analysis-section" id="analysisSection" style="display: none;">
                <h3>📊 Query Analysis</h3>
                <div id="parsedQuery"></div>
                <div id="requirements"></div>
                <button class="btn" onclick="executeParsedQuery()" id="executeBtn" disabled>🚀 Execute Query</button>
            </div>

            <!-- Status -->
            <div id="status"></div>

            <!-- Response -->
            <div id="responseSection" class="response-section" style="display: none;"></div>
        </div>
    </div>

    <script>
        const FIREBASE_CONFIG_KEY = 'flutter_firestore_parser_firebase_config';
        let firebaseApp = null;
        let db = null;
        let parsedQuery = null;
        let requiredParams = {};
        let isDocumentQuery = false;
        let isFirebaseInitialized = false;

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function parseQuery() {
            const queryText = document.getElementById('queryInput').value.trim();
            
            if (!queryText) {
                showStatus('Please enter a Flutter Firestore query', 'error');
                return;
            }

            try {
                parsedQuery = parseFlutterQuery(queryText);
                isDocumentQuery = !!parsedQuery.documentId;
                
                showStatus('✅ Query parsed successfully!', 'success');
                displayParsedQuery();
                showConfigSection();
                
            } catch (error) {
                showStatus(`❌ Parse error: ${error.message}`, 'error');
                console.error('Parse error:', error);
            }
        }

        function parseFlutterQuery(queryText) {
            const query = {
                type: null,
                collection: null,
                documentId: null,
                method: null,
                where: [],
                orderBy: [],
                limit: null,
                data: null
            };

            const collectionMatch = queryText.match(/\.collection\(['"`]([^'"`]+)['"`]\)/);
            if (collectionMatch) {
                query.collection = collectionMatch[1];
            }

            const docMatch = queryText.match(/\.doc\(([^)]+)\)/);
            if (docMatch) {
                query.documentId = extractVariableOrValue(docMatch[1]);
            }

            if (queryText.includes('.get()')) {
                query.type = 'query';
                query.method = 'get';
            } else if (queryText.includes('.set(')) {
                query.type = 'write';
                query.method = 'set';
            } else if (queryText.includes('.add(')) {
                query.type = 'write';
                query.method = 'add';
            } else if (queryText.includes('.update(')) {
                query.type = 'write';
                query.method = 'update';
            } else if (queryText.includes('.delete()')) {
                query.type = 'write';
                query.method = 'delete';
            }

            const whereMatches = queryText.match(/\.where\(['"`]([^'"`]+)['"`],\s*([^:]+):\s*([^)]+)\)/g);
            if (whereMatches) {
                whereMatches.forEach(match => {
                    const fieldMatch = match.match(/['"`]([^'"`]+)['"`]/);
                    const opMatch = match.match(/([^:]+):\s*([^)]+)/);
                    if (fieldMatch && opMatch) {
                        query.where.push({
                            field: fieldMatch[1],
                            operator: extractOperator(opMatch[2]),
                            value: extractVariableOrValue(opMatch[3])
                        });
                    }
                });
            }

            const limitMatch = queryText.match(/\.limit\(([^)]+)\)/);
            if (limitMatch) {
                query.limit = parseInt(extractVariableOrValue(limitMatch[1]));
            }

            if (query.method === 'set' || query.method === 'update' || query.method === 'add') {
                const dataMatch = queryText.match(/\{([^}]+)\}/);
                if (dataMatch) {
                    query.data = parseDataObject(dataMatch[1]);
                }
            }

            requiredParams = identifyRequiredParams(query, queryText);
            return query;
        }

        function extractVariableOrValue(str) {
            str = str.replace(/['"`]/g, '').trim();
            if (/^[+-]?\d+$/.test(str) || /^true|false|null$/.test(str)) {
                return str;
            }
            return { variable: str };
        }

        function extractOperator(str) {
            const operators = {
                'isEqualTo': '==',
                'isLessThan': '<',
                'isLessThanOrEqualTo': '<=',
                'isGreaterThan': '>',
                'isGreaterThanOrEqualTo': '>=',
                'isNotEqualTo': '!=',
                'arrayContains': 'array-contains',
                'arrayContainsAny': 'array-contains-any',
                'whereIn': 'in'
            };
            
            for (let [dartOp, firestoreOp] of Object.entries(operators)) {
                if (str.includes(dartOp)) return firestoreOp;
            }
            return '==';
        }

        function parseDataObject(dataStr) {
            try {
                const cleaned = dataStr.replace(/'/g, '"').replace(/([a-zA-Z][^:]*):/g, '"$1":');
                return JSON.parse(cleaned);
            } catch (e) {
                return { raw: dataStr };
            }
        }

        function identifyRequiredParams(query, queryText) {
            const params = {};
            
            if (query.documentId && typeof query.documentId === 'object' && query.documentId.variable) {
                params[query.documentId.variable] = 'Document ID';
            }
            
            query.where.forEach(w => {
                if (typeof w.value === 'object' && w.value.variable) {
                    params[w.value.variable] = `Filter value for ${w.field}`;
                }
            });

            return params;
        }

        function displayParsedQuery() {
            const analysisEl = document.getElementById('analysisSection');
            const parsedEl = document.getElementById('parsedQuery');
            const reqEl = document.getElementById('requirements');
            
            analysisEl.style.display = 'block';
            
            let parsedHtml = `
                <h4>📋 Parsed Query Structure</h4>
                <p><strong>Type:</strong> ${isDocumentQuery ? 'Document Query' : 'Collection Query'}</p>
                <p><strong>Collection:</strong> ${parsedQuery.collection || 'Not found'}</p>
                <p><strong>Document ID:</strong> ${parsedQuery.documentId ? (typeof parsedQuery.documentId === 'object' ? parsedQuery.documentId.variable : parsedQuery.documentId) : 'N/A'}</p>
                <p><strong>Method:</strong> ${parsedQuery.method || 'Unknown'}</p>
            `;
            
            if (parsedQuery.where.length > 0) {
                parsedHtml += `<p><strong>Filters:</strong> ${parsedQuery.where.map(w => `${w.field} ${w.operator} ?`).join(', ')}</p>`;
            }
            
            if (parsedQuery.limit) {
                parsedHtml += `<p><strong>Limit:</strong> ${parsedQuery.limit}</p>`;
            }
            
            parsedEl.innerHTML = parsedHtml;

            if (Object.keys(requiredParams).length > 0) {
                let reqHtml = `<h4>📝 Required Parameters</h4><div class="requirements-grid">`;
                Object.entries(requiredParams).forEach(([param, description]) => {
                    reqHtml += `
                        <div class="req-item">
                            <h4>${param}</h4>
                            <p>${description}</p>
                            <input type="text" id="param_${param}" placeholder="Enter value for ${param}">
                        </div>
                    `;
                });
                reqHtml += `</div>`;
                reqEl.innerHTML = reqHtml;
            } else {
                reqEl.innerHTML = '<p>✅ No additional parameters required!</p>';
            }

            document.getElementById('executeBtn').disabled = false;
            showConfigSection();
        }

        function showConfigSection() {
            document.getElementById('configSection').style.display = 'block';
            document.getElementById('initBtn').disabled = false;
        }

        async function initializeFirebase() {
            try {
                const config = {
                    apiKey: document.getElementById('apiKey').value.trim(),
                    authDomain: document.getElementById('authDomain').value.trim(),
                    projectId: document.getElementById('projectId').value.trim(),
                    appId: document.getElementById('appId').value.trim()
                };

                if (!config.apiKey || !config.projectId) {
                    throw new Error('API Key and Project ID are required');
                }

                showStatus('🔄 Initializing Firebase...', 'warning');
                
                if (firebase.apps.length > 0) {
                    await firebase.apps[0].delete();
                }
                
                firebaseApp = firebase.initializeApp(config);
                db = firebase.firestore();
                isFirebaseInitialized = true;
                
                // Save to localStorage
                localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(config));
                
                await db.collection('__test__').limit(1).get().catch(() => {});
                
                showStatus('✅ Firebase initialized and config saved!', 'success');
                document.getElementById('initBtn').disabled = true;
                document.getElementById('deleteConfigBtn').style.display = 'inline-block';
                
            } catch (error) {
                showStatus(`❌ Firebase init error: ${error.message}`, 'error');
                throw error;
            }
        }

        function deleteFirebaseConfig() {
            if (confirm('Are you sure you want to delete the saved Firebase configuration?')) {
                localStorage.removeItem(FIREBASE_CONFIG_KEY);
                document.getElementById('apiKey').value = '';
                document.getElementById('authDomain').value = '';
                document.getElementById('projectId').value = '';
                document.getElementById('appId').value = '';
                isFirebaseInitialized = false;
                if (firebase.apps.length > 0) {
                    firebase.apps[0].delete();
                    firebaseApp = null;
                    db = null;
                }
                document.getElementById('initBtn').disabled = false;
                document.getElementById('deleteConfigBtn').style.display = 'none';
                showStatus('🧹 Firebase config deleted from local storage', 'warning');
            }
        }

        async function executeParsedQuery() {
            if (!isFirebaseInitialized) {
                showStatus('⚠️ Firebase not initialized. Please initialize first.', 'warning');
                return;
            }

            try {
                showStatus(`🔄 Executing ${isDocumentQuery ? 'document' : 'collection'} query...`, 'warning');
                
                const params = {};
                Object.keys(requiredParams).forEach(param => {
                    const value = document.getElementById(`param_${param}`)?.value.trim();
                    if (value) {
                        params[param] = value;
                    }
                });

                let result;
                let queryRef;

                if (parsedQuery.documentId) {
                    const docId = typeof parsedQuery.documentId === 'object' ? 
                        params[parsedQuery.documentId.variable] || parsedQuery.documentId.variable : 
                        parsedQuery.documentId;
                    
                    queryRef = db.collection(parsedQuery.collection).doc(docId);
                } else {
                    queryRef = db.collection(parsedQuery.collection);
                    
                    parsedQuery.where.forEach(w => {
                        const value = typeof w.value === 'object' ? params[w.value.variable] : w.value;
                        if (value !== undefined) {
                            queryRef = queryRef.where(w.field, w.operator, value);
                        }
                    });
                    
                    if (parsedQuery.limit) {
                        queryRef = queryRef.limit(parsedQuery.limit);
                    }
                }

                switch (parsedQuery.method) {
                    case 'get':
                        if (isDocumentQuery) {
                            const docSnap = await queryRef.get();
                            result = {
                                exists: docSnap.exists,
                                id: docSnap.id,
                                data: docSnap.exists ? docSnap.data() : null,
                                metadata: {
                                    hasPendingWrites: docSnap.metadata.hasPendingWrites,
                                    fromCache: docSnap.metadata.fromCache
                                }
                            };
                        } else {
                            const querySnap = await queryRef.get();
                            result = querySnap.docs.map(doc => ({
                                id: doc.id,
                                data: doc.data(),
                                exists: true
                            }));
                        }
                        break;
                        
                    case 'set':
                        const setData = parsedQuery.data || {};
                        await queryRef.set(setData, { merge: false });
                        result = { message: 'Document set successfully', id: queryRef.id };
                        break;
                        
                    case 'add':
                        const addRef = await db.collection(parsedQuery.collection).add(parsedQuery.data || {});
                        result = { id: addRef.id, message: 'Document added successfully' };
                        break;
                        
                    case 'update':
                        await queryRef.update(parsedQuery.data || {});
                        result = { message: 'Document updated successfully', id: queryRef.id };
                        break;
                        
                    case 'delete':
                        await queryRef.delete();
                        result = { message: 'Document deleted successfully', id: queryRef.id };
                        break;
                        
                    default:
                        throw new Error(`Unsupported method: ${parsedQuery.method}`);
                }
                
                displayResponse(result);
                showStatus(`✅ ${parsedQuery.method.toUpperCase()} completed successfully!`, 'success');
                
            } catch (error) {
                console.error('Execution error:', error);
                showStatus(`❌ Execution error: ${error.message}`, 'error');
                displayResponse({ 
                    error: error.message, 
                    code: error.code,
                    details: error.details 
                });
            }
        }

        function displayResponse(result) {
            const responseEl = document.getElementById('responseSection');
            
            if (result.error) {
                responseEl.innerHTML = `<span style="color: #ff6b6b;">ERROR: ${JSON.stringify(result, null, 2)}</span>`;
            } else {
                responseEl.textContent = JSON.stringify(result, null, 2);
            }
            
            responseEl.style.display = 'block';
            responseEl.scrollTop = 0;
        }

        function clearAll() {
            document.getElementById('queryInput').value = '';
            document.getElementById('analysisSection').style.display = 'none';
            document.getElementById('configSection').style.display = 'none';
            document.getElementById('responseSection').style.display = 'none';
            document.getElementById('status').innerHTML = '';
            parsedQuery = null;
            requiredParams = {};
            isDocumentQuery = false;
            isFirebaseInitialized = false;
            document.getElementById('initBtn').disabled = false;
            document.getElementById('deleteConfigBtn').style.display = 'none';
            
            if (firebase.apps.length > 0) {
                firebase.apps[0].delete();
                firebaseApp = null;
                db = null;
            }
        }

        // Load saved config on page load
        document.addEventListener('DOMContentLoaded', () => {
            const savedConfig = localStorage.getItem(FIREBASE_CONFIG_KEY);
            if (savedConfig) {
                try {
                    const config = JSON.parse(savedConfig);
                    document.getElementById('apiKey').value = config.apiKey || '';
                    document.getElementById('authDomain').value = config.authDomain || '';
                    document.getElementById('projectId').value = config.projectId || '';
                    document.getElementById('appId').value = config.appId || '';
                    document.getElementById('configSection').style.display = 'block';
                    document.getElementById('deleteConfigBtn').style.display = 'inline-block';
                } catch (e) {
                    console.warn('Failed to load saved config', e);
                    localStorage.removeItem(FIREBASE_CONFIG_KEY);
                }
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 'Enter':
                        e.preventDefault();
                        parseQuery();
                        break;
                    case 'e':
                        e.preventDefault();
                        executeParsedQuery();
                        break;
                }
            }
        });

        // Pre-fill example phone number
        document.getElementById('queryInput').addEventListener('focus', function() {
            if (!this.value.includes('phoneNumber')) {
                const paramInput = document.querySelector('input[id*="param_phoneNumber"]');
                if (paramInput) paramInput.value = '+1234567890';
            }
        });
    </script>
</body>
</html>
